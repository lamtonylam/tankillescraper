name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run tsc
      - run: npm run lint
      - run: timeout 10 npm start || true
