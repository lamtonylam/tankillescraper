name: Docker Build and Run

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t tankille-app .
      - name: Run container
        run: docker run --rm -d --name tankille-test -p 4000:4000 -e PORT=4000 tankille-app
      - name: Wait for startup
        run: sleep 5
      - name: Check container health
        run: |
          curl -sf -H 'content-type: application/json' -X POST -d '{"query":"{__typename}"}' http://localhost:4000/graphql || exit 1
          echo "Container is running and responding"
      - name: Stop and cleanup
        run: docker stop tankille-test || true
